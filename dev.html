<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Limo ai — لوحة المطور</title>
<style>
  :root{
    --bg:#0d0b1a; --panel:#17142b; --panel2:#1f1b3a; --border:#2d2850;
    --violet:#8b5cf6; --teal:#2dd4bf; --text:#ece9ff; --muted:#9892c4;
    --danger:#f87171; --warn:#fbbf24; --ok:#34d399;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0; background:linear-gradient(180deg,#140f2e,var(--bg) 40%); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Tahoma,Arial,sans-serif;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
    min-height:100%;
  }
  .wrap{max-width:1100px; margin:0 auto; padding:16px}
  .gate{min-height:90vh; display:flex; align-items:center; justify-content:center; flex-direction:column; gap:16px; text-align:center; padding:24px}
  .gate img{width:84px; height:84px; border-radius:22px}
  .gate h1{font-size:20px; margin:0}
  .gate p{color:var(--muted); font-size:14px; max-width:320px; line-height:1.7}
  button{font-family:inherit; cursor:pointer; border:none}
  .btn{background:linear-gradient(135deg,var(--violet),#6d28d9); color:#fff; padding:12px 22px; border-radius:14px; font-size:15px; font-weight:600}
  .btn:active{transform:scale(.97)}
  .btn.ghost{background:transparent; border:1px solid var(--border); color:var(--text)}
  .btn.danger{background:rgba(248,113,113,.15); color:var(--danger); border:1px solid rgba(248,113,113,.4)}
  .btn.small{padding:7px 12px; font-size:12.5px; border-radius:10px}
  header.top{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px 4px; position:sticky; top:env(safe-area-inset-top,0px); background:var(--bg); z-index:5; border-bottom:1px solid var(--border)}
  header.top .who{display:flex; align-items:center; gap:10px; font-size:13px; color:var(--muted)}
  header.top .who img{width:30px; height:30px; border-radius:50%}
  h2.sec{font-size:15px; color:var(--muted); margin:26px 2px 10px; font-weight:600}
  .grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:10px}
  .card{background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:14px}
  .card .num{font-size:22px; font-weight:700}
  .card .lbl{font-size:12px; color:var(--muted); margin-top:4px; line-height:1.5}
  .card .note{font-size:10.5px; color:#716c99; margin-top:6px; line-height:1.5}
  .row{display:flex; gap:10px; flex-wrap:wrap; align-items:center}
  input[type=text]{
    width:100%; background:var(--panel2); border:1px solid var(--border); color:var(--text);
    padding:11px 14px; border-radius:12px; font-size:14px; outline:none;
  }
  .list{display:flex; flex-direction:column; gap:8px; margin-top:10px}
  .urow{background:var(--panel); border:1px solid var(--border); border-radius:14px; padding:12px 14px; display:flex; align-items:center; gap:12px; cursor:pointer}
  .urow:active{background:var(--panel2)}
  .urow img{width:38px; height:38px; border-radius:50%; flex:none; background:#333}
  .urow .meta{flex:1; min-width:0}
  .urow .meta .n{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .urow .meta .e{font-size:12px; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
  .badge{font-size:10.5px; padding:3px 8px; border-radius:999px; white-space:nowrap}
  .badge.flag{background:rgba(248,113,113,.18); color:var(--danger)}
  .badge.blocked{background:rgba(248,113,113,.28); color:var(--danger)}
  .badge.ok{background:rgba(52,211,153,.15); color:var(--ok)}
  .topics{display:flex; flex-wrap:wrap; gap:8px}
  .topics span{background:var(--panel2); border:1px solid var(--border); padding:6px 12px; border-radius:999px; font-size:12.5px}
  .topics span b{color:var(--teal)}
  .overlay{position:fixed; inset:0; background:var(--bg); z-index:40; overflow-y:auto; display:none}
  .overlay.on{display:block}
  .ov-head{display:flex; align-items:center; gap:12px; padding:14px 16px; border-bottom:1px solid var(--border); position:sticky; top:0; background:var(--bg); z-index:2}
  .ov-head img{width:46px; height:46px; border-radius:50%; background:#333}
  .ov-head .n{font-size:16px; font-weight:700}
  .ov-head .e{font-size:12.5px; color:var(--muted)}
  .ov-body{padding:16px}
  .chatrow{background:var(--panel); border:1px solid var(--border); border-radius:12px; padding:11px 14px; margin-bottom:8px; cursor:pointer}
  .chatrow .t{font-size:13.5px; font-weight:600}
  .chatrow .d{font-size:11.5px; color:var(--muted); margin-top:3px}
  .msg{padding:10px 14px; border-radius:14px; margin-bottom:8px; font-size:13.5px; line-height:1.7; max-width:85%}
  .msg.user{background:var(--panel2); margin-inline-start:auto}
  .msg.bot{background:var(--panel); border:1px solid var(--border)}
  .msg .r{font-size:10.5px; color:var(--muted); margin-bottom:4px}
  .empty{text-align:center; color:var(--muted); font-size:13px; padding:40px 10px}
  .spin{width:30px; height:30px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--teal); animation:sp 1s linear infinite; margin:0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .flagwarn{background:rgba(248,113,113,.1); border:1px solid rgba(248,113,113,.35); color:#fca5a5; font-size:12.5px; padding:10px 14px; border-radius:12px; margin-bottom:12px; line-height:1.8}
  .toast{position:fixed; bottom:calc(20px + env(safe-area-inset-bottom,0px)); left:50%; transform:translateX(-50%); background:var(--panel2); border:1px solid var(--border); padding:10px 18px; border-radius:999px; font-size:13px; z-index:60; display:none}
</style>
</head>
<body>

<div id="gate" class="gate">
  <img src="./icon-512.png" alt="Limo">
  <h1>لوحة مطور Limo ai</h1>
  <p id="gateMsg">هالصفحة مخصصة لصاحب التطبيق بس. سجّل دخول بحساب Google المصرّح له للمتابعة.</p>
  <button class="btn" id="loginBtn">تسجيل الدخول بـ Google</button>
</div>

<div id="app" style="display:none">
  <div class="wrap">
    <header class="top">
      <div class="who">
        <img id="meImg" src="" alt="">
        <span id="meName">—</span>
      </div>
      <button class="btn ghost small" id="logoutBtn">خروج</button>
    </header>

    <h2 class="sec">نظرة عامة</h2>
    <div id="stats" class="grid"><div class="card"><div class="spin"></div></div></div>

    <h2 class="sec">أكثر المواضيع</h2>
    <div id="topics" class="topics"><span style="color:var(--muted)">...جاري التحليل</span></div>

    <h2 class="sec">المستخدمون (<span id="uCount">0</span>)</h2>
    <input type="text" id="search" placeholder="ابحث بالاسم أو الإيميل...">
    <div id="list" class="list"><div class="empty"><div class="spin"></div></div></div>
  </div>
</div>

<div id="overlay" class="overlay">
  <div class="ov-head">
    <button class="btn ghost small" id="backBtn">رجوع</button>
    <img id="ovImg" src="" alt="">
    <div style="flex:1">
      <div class="n" id="ovName">—</div>
      <div class="e" id="ovEmail">—</div>
    </div>
  </div>
  <div class="ov-body" id="ovBody"></div>
</div>

<div class="toast" id="toast"></div>

<script type="module">
const FBC = {apiKey:"AIzaSyCfJuEkM6ZQGtfGN3TPd9haVxOOlqFEqrE", authDomain:"limo-ai-b546f.firebaseapp.com", projectId:"limo-ai-b546f", storageBucket:"limo-ai-b546f.firebasestorage.app", messagingSenderId:"86977460870", appId:"1:86977460870:web:82778cd882a64364826f07"};
const ADMIN_UID = "FJItvYBKNFgotglwDrv4DRmDUyC3"; // حسابك بس يقدر يدخل هالصفحة

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, getRedirectResult, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, updateDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp(FBC);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = (id) => document.getElementById(id);
function toast(t){ const el = $('toast'); el.textContent = t; el.style.display = 'block'; clearTimeout(window.__tt); window.__tt = setTimeout(() => el.style.display = 'none', 2200); }

// ---- تسجيل الدخول ----
$('loginBtn').onclick = async () => {
  const pr = new GoogleAuthProvider(); pr.setCustomParameters({prompt:'select_account'});
  try { await signInWithPopup(auth, pr); }
  catch(e){ if (e.code === 'auth/popup-blocked' || e.code === 'auth/cancelled-popup-request'){ await signInWithRedirect(auth, pr); } else { toast('صار خطأ بتسجيل الدخول'); } }
};
$('logoutBtn').onclick = () => signOut(auth).then(() => location.reload());

getRedirectResult(auth).catch(() => {});

let ALL_USERS = [];

onAuthStateChanged(auth, async (u) => {
  if (!u){ $('gate').style.display = 'flex'; $('app').style.display = 'none'; return; }
  if (u.uid !== ADMIN_UID){
    $('gateMsg').textContent = 'هذا الحساب ما عنده صلاحية دخول لوحة المطور.';
    $('gateMsg').style.color = '#fca5a5';
    $('loginBtn').textContent = 'جرّب حساب ثاني';
    await signOut(auth);
    return;
  }
  $('gate').style.display = 'none';
  $('app').style.display = 'block';
  $('meImg').src = u.photoURL || './icon-192.png';
  $('meName').textContent = u.displayName || u.email || 'المطور';
  loadAll();
});

// ---- تحميل كل المستخدمين وحساب الإحصائيات ----
const STOP = new Set(['من','في','على','الى','إلى','عن','مع','هذا','هذه','ذلك','التي','الذي','كان','كانت','يكون','انا','أنا','انت','أنت','هو','هي','احنا','نحن','هم','ما','لا','لم','لن','قد','كل','بس','يعني','شو','وش','ليش','كيف','وين','متى','هل','او','أو','ثم','لكن','بين','عند','كذا','زي','الان','اليوم','the','and','you','is','are','in','on','to','of','for','with','that','this','it','was','were','what','how','why','when','where']);

function topicWords(usersArr){
  const freq = new Map();
  usersArr.forEach(u => (u.chats || []).forEach(c => (c.h || []).forEach(m => {
    if (!m || !m.text) return;
    (String(m.text).toLowerCase().match(/[\u0600-\u06FFa-z]{3,}/g) || []).forEach(w => {
      if (STOP.has(w)) return;
      freq.set(w, (freq.get(w) || 0) + 1);
    });
  })));
  return [...freq.entries()].sort((a,b) => b[1]-a[1]).slice(0, 18);
}

const RISK_WORDS = ['انتحار','اذيت نفسي','أؤذي نفسي','اقتل نفسي','ابي اموت','ودي اموت','مابي اعيش','suicide','kill myself','self harm','end my life','hurt myself'];
function isFlagged(u){
  return (u.chats || []).some(c => (c.h || []).some(m => m && m.text && RISK_WORDS.some(w => String(m.text).toLowerCase().includes(w))));
}

function countryFromTz(tz){
  if (!tz) return 'غير معروف';
  const city = tz.split('/').pop().replace(/_/g,' ');
  return city || tz;
}

async function loadAll(){
  const snap = await getDocs(collection(db, 'users'));
  const users = [];
  snap.forEach(d => users.push({id:d.id, ...d.data()}));
  ALL_USERS = users;
  renderStats(users);
  renderTopics(users);
  renderList(users);
}

function renderStats(users){
  const now = Date.now(), DAY = 86400000;
  const total = users.length;
  const active1d = users.filter(u => u.lastActive && now - u.lastActive < DAY).length;
  const active7d = users.filter(u => u.lastActive && now - u.lastActive < 7*DAY).length;
  const active30d = users.filter(u => u.lastActive && now - u.lastActive < 30*DAY).length;
  const idle7dRate = total ? Math.round((1 - active7d/total) * 100) : 0;

  let sessions=0, installs=0, created=0, deleted=0, flagged=0, blocked=0;
  users.forEach(u => {
    const s = u.stats || {};
    sessions += s.sessions || 0;
    if ((s.installs || 0) > 0) installs++;
    created += s.chatsCreated || 0;
    deleted += s.chatsDeleted || 0;
    if (isFlagged(u)) flagged++;
    if (u.blocked) blocked++;
  });
  const delRate = created ? Math.round((deleted/created) * 100) : 0;
  const installRate = total ? Math.round((installs/total) * 100) : 0;
  const avgSessions = total ? (sessions/total).toFixed(1) : '0';

  const cards = [
    [total, 'إجمالي المستخدمين'],
    [active1d, 'نشطين آخر 24 ساعة'],
    [active7d, 'نشطين آخر أسبوع'],
    [active30d, 'نشطين آخر شهر'],
    [idle7dRate + '%', 'نسبة خمول (أسبوع)', 'تقريبية، مبنية على آخر نشاط مسجّل'],
    [avgSessions, 'متوسط الجلسات / مستخدم'],
    [installs, 'تثبيتات (PWA)', 'حسابات ثبّتت التطبيق على جهاز وحد على الأقل'],
    [installRate + '%', 'نسبة التثبيت'],
    [created, 'محادثات أُنشئت'],
    [deleted, 'محادثات اتحذفت'],
    [delRate + '%', 'نسبة الحذف'],
    [flagged, 'محادثات فيها تنبيه ⚠️'],
    [blocked, 'حسابات محظورة'],
  ];
  $('stats').innerHTML = cards.map(c => `<div class="card"><div class="num">${c[0]}</div><div class="lbl">${c[1]}</div>${c[2] ? `<div class="note">${c[2]}</div>` : ''}</div>`).join('');
}

function renderTopics(users){
  const t = topicWords(users);
  $('topics').innerHTML = t.length ? t.map(([w,n]) => `<span>${w} <b>${n}</b></span>`).join('') : '<span style="color:var(--muted)">ما فيه بيانات كافية بعد</span>';
}

function renderList(users){
  $('uCount').textContent = users.length;
  const html = users
    .slice()
    .sort((a,b) => (b.lastActive||0) - (a.lastActive||0))
    .map(u => {
      const flagged = isFlagged(u);
      return `<div class="urow" data-id="${u.id}">
        <img src="${u.photo || './icon-192.png'}" onerror="this.src='./icon-192.png'">
        <div class="meta">
          <div class="n">${esc(u.name || 'بدون اسم')}</div>
          <div class="e">${esc(u.email || '')} · ${countryFromTz(u.tz)}</div>
        </div>
        ${u.blocked ? '<span class="badge blocked">محظور</span>' : ''}
        ${flagged ? '<span class="badge flag">⚠️</span>' : ''}
      </div>`;
    }).join('');
  $('list').innerHTML = html || '<div class="empty">ما فيه مستخدمين بعد</div>';
  [...document.querySelectorAll('.urow')].forEach(el => el.onclick = () => openUser(el.dataset.id));
}

$('search').oninput = (e) => {
  const q = e.target.value.trim().toLowerCase();
  if (!q){ renderList(ALL_USERS); return; }
  renderList(ALL_USERS.filter(u => (u.name||'').toLowerCase().includes(q) || (u.email||'').toLowerCase().includes(q)));
};

function esc(s){ const d = document.createElement('div'); d.textContent = s == null ? '' : String(s); return d.innerHTML; }

// ---- تفاصيل مستخدم ----
function openUser(id){
  const u = ALL_USERS.find(x => x.id === id);
  if (!u) return;
  $('ovImg').src = u.photo || './icon-192.png';
  $('ovName').textContent = u.name || 'بدون اسم';
  $('ovEmail').textContent = u.email || '';

  const flagged = isFlagged(u);
  const s = u.stats || {};
  const chatsHtml = (u.chats || []).slice().sort((a,b) => (b.ts||0)-(a.ts||0)).map((c, i) => {
    const d = c.ts ? new Date(c.ts).toLocaleString('ar') : '';
    const chatFlag = (c.h||[]).some(m => m && m.text && RISK_WORDS.some(w => String(m.text).toLowerCase().includes(w)));
    return `<div class="chatrow" data-i="${i}"><div class="t">${chatFlag ? '⚠️ ' : ''}${esc(c.title || 'محادثة')}</div><div class="d">${d} · ${(c.h||[]).length} رسالة</div></div>`;
  }).join('') || '<div class="empty">ما فيه محادثات محفوظة</div>';

  $('ovBody').innerHTML = `
    ${flagged ? '<div class="flagwarn">⚠️ فيه رسالة بمحادثات هالمستخدم تحتوي كلمات مرتبطة بضيق نفسي أو خطر على النفس. راجعها بعين الاعتبار والحساسية.</div>' : ''}
    <div class="row" style="margin-bottom:16px">
      <button class="btn small ${u.blocked ? '' : 'danger'}" id="blockBtn">${u.blocked ? 'إلغاء الحظر' : 'حظر الحساب'}</button>
      <span class="badge ok">جلسات: ${s.sessions||0}</span>
      <span class="badge ok">تثبيتات: ${s.installs||0}</span>
      <span class="badge ok">أُنشئت: ${s.chatsCreated||0}</span>
      <span class="badge ok">اتحذفت: ${s.chatsDeleted||0}</span>
    </div>
    <h2 class="sec" style="margin-top:0">المحادثات</h2>
    <div id="chatList">${chatsHtml}</div>
    <div id="chatView"></div>
  `;

  $('blockBtn').onclick = async () => {
    try {
      await updateDoc(doc(db, 'users', u.id), {blocked: !u.blocked});
      u.blocked = !u.blocked;
      toast(u.blocked ? 'انحظر الحساب' : 'انفك الحظر');
      openUser(id);
      renderList(ALL_USERS);
    } catch(e){ toast('ما قدرت أحدّث الحساب'); }
  };

  [...document.querySelectorAll('#chatList .chatrow')].forEach(el => el.onclick = () => {
    const c = (u.chats||[]).slice().sort((a,b) => (b.ts||0)-(a.ts||0))[+el.dataset.i];
    renderChatView(c);
  });

  $('overlay').classList.add('on');
}
function renderChatView(c){
  const html = (c.h || []).map(m => `<div class="msg ${m.role === 'user' ? 'user' : 'bot'}"><div class="r">${m.role === 'user' ? 'المستخدم' : 'ليمو'}</div>${esc(m.text || '')}</div>`).join('');
  $('chatView').innerHTML = `<h2 class="sec">${esc(c.title||'محادثة')}</h2>${html || '<div class="empty">فاضية</div>'}`;
  $('chatView').scrollIntoView({behavior:'smooth'});
}
$('backBtn').onclick = () => $('overlay').classList.remove('on');
</script>
</body>
</html>
